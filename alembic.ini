# Alembic config. The database URL is not set here — env.py reads it from
# backend.config.settings (.env), so credentials live in one place.
#
#   alembic upgrade head                          apply all pending migrations
#   alembic revision --autogenerate -m "message"  draft a migration from models.py
#   alembic downgrade -1                          undo the last migration
#   alembic history                               list migrations
#
# The app also runs `upgrade head` on startup (backend/main.py).

[alembic]
script_location = %(here)s/backend/db/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
